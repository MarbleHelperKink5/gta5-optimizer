player_health    = "GTA5.exe!89 83 ?? ?? ?? ?? 8B 83" ; 0x2
godmode_flag     = "GTA5.exe!C6 83 ?? ?? ?? ?? 01 48 8B" ; 0x3

[vehicle]
vehicle_ptr      = "GTA5.exe!48 8B 05 ?? ?? ?? ?? 48 8B 88 ?? ?? ?? ??" ; 0x3
vehicle_handling = "GTA5.exe!F3 0F 10 8B ?? ?? ?? ??" ; 0x4

[graphics]
renderer_base    = "GTA5.exe!48 8B 05 ?? ?? ?? ?? 48 8B 88 ?? ?? ?? ?? 48 85 C9" ; 0x3
fps_cap          = "GTA5.exe!89 0D ?? ?? ?? ?? C7 05" ; 0x2