[profile]
name = Performance
description = Drops shadow quality, disables motion blur, raises fps cap.

[graphics]
shadow_quality   = low
motion_blur      = off
depth_of_field   = off
msaa             = 0
fps_cap          = 240

[memory]
enable_patcher   = true
gc_hint          = aggressive

[overlay]
show_fps         = true
show_frametime   = true